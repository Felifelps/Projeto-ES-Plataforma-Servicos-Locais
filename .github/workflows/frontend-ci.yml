name: Frontend CI - Build e Testes

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    
    
    defaults:
      run:
        working-directory: ./frontend 

    steps:
      - name: 📥 Checkout do repositório
        uses: actions/checkout@v4

      - name: ⚙️ Configurar o Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: 📦 Instalar dependências
        run: npm ci 

      - name: 🔨 Fazer o Build
        run: npm run build

      - name: 🧪 Rodar Testes
        
        env:
          CI: true
        run: npm test